name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app/ evals/ alembic/

      - name: Test
        working-directory: backend
        run: pytest -q

      # Whether the AI parts still work, not just whether they run. Retrieval
      # embeds locally and the syllabus suite scores the deterministic parser,
      # so neither needs an API key and both can gate a push. Thresholds are
      # asserted by pytest above; this prints the numbers so a run's log shows
      # the trend rather than only pass/fail.
      - name: Evals
        working-directory: backend
        run: python -m evals.run

  # Runs the installer a user actually runs, on both platforms, then boots
  # what it produced.
  #
  # This exists because a working local venv proves nothing about a clean one.
  # SQLAlchemy declares `greenlet` conditionally (python_version < "3.13"), so a
  # fresh install on 3.13 once produced an app where every database call raised
  # at runtime while the whole test suite still passed locally. Import checks
  # alone would not have caught it -- the failure only appears once the async
  # engine opens a connection, so this job drives a real request.
  #
  # Windows is in the matrix deliberately. install.bat once shipped exiting 255
  # for every user and setup.sh shipped with CRLF shebangs, both on a repo whose
  # CI was Linux-only. The installer is the first thing a user touches and was
  # the last thing anything tested.
  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Atlas the way a user does
        run: python install.py --quiet

      - name: Boot it and exercise the database
        shell: bash
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-fresh
        run: |
          python start.py --port 8000 --no-browser &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done

          echo "--- health ---"
          curl -sf http://127.0.0.1:8000/api/v1/health || {
            echo "health check failed"; exit 1; }

          echo "--- the interface is served, not just the API ---"
          curl -sf http://127.0.0.1:8000/ >/dev/null || {
            echo "SPA was not served"; exit 1; }

          # Hits the async SQLAlchemy engine for real; a missing greenlet fails here.
          echo "--- profiles (exercises the DB) ---"
          curl -sf http://127.0.0.1:8000/api/v1/profiles || {
            echo "database call failed"; exit 1; }

          echo "--- creating a profile (write path) ---"
          curl -sf -X POST http://127.0.0.1:8000/api/v1/profiles \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Smoke","profile_type":"Custom Learning"}' || {
            echo "profile creation failed"; exit 1; }

          echo ""
          echo "fresh install is functional"

      - name: start.py refuses clearly when nothing is installed
        shell: bash
        run: |
          # The most common first mistake: run the launcher before the
          # installer. It must name the fix, not stack-trace.
          rm -rf backend/.venv
          if python start.py --no-browser 2>err.txt; then
            echo "expected a non-zero exit"; exit 1
          fi
          grep -q "install.py" err.txt || {
            echo "the error did not point at install.py:"; cat err.txt; exit 1; }
          echo "refused correctly:"; cat err.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 22, not 20. Vitest reaches global fetch, which uses the undici that
      # Node bundles, and Node 20's is old enough to be missing
      # webidl.util.markAsUncloneable -- every worker died on it before a
      # single test ran. The installer job still builds on 20, which is what
      # the README promises users.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets-scan:
    name: No committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git and may contain API keys"
            exit 1
          fi
          echo ".env is not tracked"

      - name: Ensure .env.example carries no real values
        run: |
          if grep -nE '^[A-Z_]*(API_KEY|TOKEN|SECRET)=.+' .env.example; then
            echo "::error::.env.example contains a non-empty credential"
            exit 1
          fi
          echo ".env.example has no populated credentials"
